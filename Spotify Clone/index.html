<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utillities.css">

</head>

<body>
    <div class="container flex bg-black">
        <div class="left">
            <div class="close">
                <img  class="invert" src="close.svg" alt="">
            </div>
            <div class="home bg-grey rounded m1 p-1">
                <div class="logo">
                    <img  src="spotify-logo.svg" alt="">
                </div>
                <ul>
                    <li><img class="invert" src="home.svg" alt="">Home</li>
                    <li><img class="invert" src="search.svg" alt=""> Search</li>
                </ul>

            </div>
            <div class="library bg-grey rounded m1 p-1">
                <div class="heading">

                    <img class="invert" src="playlist.svg" alt="">
                    <h2>
                        Your Library
                    </h2>
                    
                </div>
                <div class="songlist">
                    <ul>
                       <!-- <li>
                           <div class="info">
                            <img class="invert" src="music.svg" alt="">
                            <div>Song Name</div>
                            <div>Song Artist</div>
                        </div>
                        <div class="playnow">
                            <span>Play Now</span>
                        <img class="invert" src="playsong.svg" alt=""></div>
                       </li> -->
                    </ul>
                </div>
                
                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>
        </div>
        <div class="right bg-grey rounded">

            <div class="header">

                <div class="nav">
                    <div class="hamburgerCont">

                        <img class="invert hamburger" src="hamburger.svg" alt="">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                        color="currentColor" fill="none">
                        <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                    color="currentColor" fill="none">
                    <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </div>
                </div>
                <div class="buttons">

                    <button class="signupbtn">Sign Up</button>
                    <button  class="loginbtn">Log In</button>

                </div>
            </div>
            <div class="SpotifyPlaylists">
                <h1>Spotify Playlist</h1>
                <div class="cardContainer">
                    <div class="card border">
                        <div class="play">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
                                role="img" aria-label="Play video button">
                                <circle cx="32" cy="32" r="30" fill="#22C55E" />
                                <polygon points="26,20 26,44 46,32" fill="#FFFFFF" />
                            </svg>
                        </div>
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAWhlNxCa3MytQZaoEFZ55dGLNw6Yud0wk4A&s"
                            alt="">
                            <h2>Happy Hits!</h2>
                            <p>Hits to boost your mood and fil you with hapiness</p>
                        </div>
                        <div class="card border">
                            <div class="play">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
                                role="img" aria-label="Play video button">
                                <circle cx="32" cy="32" r="30" fill="#22C55E" />
                                <polygon points="26,20 26,44 46,32" fill="#FFFFFF" />
                            </svg>
                        </div>
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAWhlNxCa3MytQZaoEFZ55dGLNw6Yud0wk4A&s"
                            alt="">
                            <h2>Happy Hits!</h2>
                            <p>Hits to boost your mood and fil you with hapiness</p>
                        </div>
                        
                </div>

            </div>
            <div class="playbar">
                <div class="seekbar">
                    <div class="circle">

                    </div>
                </div>
                <div class="abovebar">

                    <div class="songinfo">
                        
                    </div>
                    <div class="songbuttons">
                        <img width="35"class="invert" id="previous" src="previous.svg" alt="">
                        <img width="35"class="invert" id="play" src="playsong.svg" alt="">
                        <img width="35"class="invert" id="next" src="nextsong.svg" alt="">
                    </div>
                    <div class="songtime">
                        
                    </div>
                </div>
            </div>

        </div>
<script src="script.js"></script>
</body>

</html>

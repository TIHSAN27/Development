<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    header{
      position: sticky;
      top: 0;
    }

    nav {
      background-color: lightpink;
      height: 83px;
      
    }

    .container {
      background-color: green;
      margin: 12px 33px;
      text-align: center;
      padding: 55px 10PX;
    }

    .box1 {
      background-color: purple;
      height: 70vh;
      width: 45%;
      display: inline-block;
      margin 0 12px
      
    }

    .box2 {
      background-color: blue;
      height: 70vh;
      width: 45%;
      display: inline-block;
      margin 0 12px
    }
    footer {
      background-color: lightgray;
      height: 100px;
    }
    .text {
      text-align: center;
      margin: 50px 34vw;
      font-size: 24px;
      font-weight: bold;
      padding: 34px;
      border: 2px solid black;
      border-radius: 12px;
    }
    main{
      padding: 30px;
      background-color: black;
    }
    .navbar ul{
      list-style-type:none; 
      display: flex;
      justify-content:right;
      align-items: center;
      height: 100%;
      padding: 0px;
      margin-right: 300px;
    }
    ul li{
      margin-left: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    
    }
    .ultra{ 
      position: absolute;
      left: 50px;
      top: 20px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      justify-content: center


      
    }
  </style>
</head>

<body>
  <nav>
    <d class="navbar">
      <ul>
      <li>Products</li>
      <li>Pricing</li>
      <li>Resources</li>
      <li>About us</li>
    </ul></d>
    <div class="ultra">
      <p>UltraEdit</p>
    </div>

  </nav>
  <main>
    <div class="container">
      <div class="box1"></div>
      <div class="box2"></div>
    </div>
  </main>
  <div class="text">
    <p>Welcome To Sigma Web development</p>
  </div>
  <footer></footer>
</body>

</html>
